<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Área administrativa da CS Serviços">

    <title>CS Serviços | Área Administrativa</title>

    <link rel="icon" type="image/png" href="../assets/images/logo-cs-servicos.png">

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login">

        <div class="login-card">

            <div class="login-brand">

                <img
                    src="../assets/images/logo-cs-servicos.png"
                    alt="CS Serviços"
                    class="login-logo"
                >

                <span class="eyebrow">
                    CS SERVIÇOS
                </span>

            </div>

            <div class="login-header">

                <h1>
                    Área Administrativa
                </h1>

                <p>
                    Acesso exclusivo para gerenciamento da empresa.
                </p>

            </div>

            <form id="loginForm" autocomplete="off">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></p>

            </form>

            <div class="login-footer">

                <span>
                    Acesso protegido
                </span>

            </div>

        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>

</html>
