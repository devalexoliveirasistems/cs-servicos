<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS Serviços | Área Administrativa</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login">

        <div class="login-card">

            <h1>CS Serviços</h1>

            <p>Área Administrativa</p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>

</html>
